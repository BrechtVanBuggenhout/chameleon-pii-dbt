version: 2

models:
  - name: pii_content_findings
    description: >
      Content/value scan results. PII found by inspecting actual column VALUES in
      name-innocent STRING or JSON columns (e.g. emails inside a free-text `notes`
      column, or buried inside a JSON payload) — the PII that name-based detection
      can't see. A JSON-column finding means the pattern matched somewhere inside
      the whole blob, not a specific nested key. OFF by default
      (var pii_content_scan_enabled); the expensive data plane, run on a schedule.
    columns:
      - name: table_catalog
        description: GCP project the scanned table lives in (pii_content_scan_datasets can span projects).
      - name: table_schema
        description: Dataset the scanned table lives in.
      - name: table_name
        description: Table scanned.
      - name: column_name
        description: Name-innocent column whose values matched a PII pattern.
      - name: source_data_type
        description: >
          BigQuery type of the scanned column — STRING or JSON. For JSON columns,
          the match was found somewhere inside the whole flattened blob
          (TO_JSON_STRING), not at a specific nested path.
        tests:
          - accepted_values:
              values: [STRING, JSON]
      - name: pattern
        description: EMAIL | PHONE | SSN | CREDIT_CARD | IP.
        tests:
          - accepted_values:
              values: [EMAIL, PHONE, SSN, CREDIT_CARD, IP]
      - name: classification
        description: Inferred classification for the matched value pattern.
        tests:
          - accepted_values:
              values: [DIRECT_IDENTIFIER, QUASI_IDENTIFIER, CONTACT, SENSITIVE, BEHAVIORAL, SYSTEM_IDENTIFIER]
      - name: sampled_rows
        description: Rows examined in the sample.
      - name: match_count
        description: Rows in the sample whose value matched the pattern.
      - name: match_rate
        description: match_count / sampled_rows.
