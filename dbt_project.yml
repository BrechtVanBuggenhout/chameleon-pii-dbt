name: chameleon_pii
version: "1.2.0"
config-version: 2

require-dbt-version: [">=1.5.0", "<2.0.0"]

macro-paths: ["macros"]
model-paths: ["models"]

vars:
  # Master switch for name-based inference on documented columns.
  pii_inference_enabled: true

  # Discovery: scan INFORMATION_SCHEMA column names for undeclared PII.
  # Metadata only (reads names, not values). Defaults to every dataset this
  # project touches (source() schemas + model schemas + the target schema,
  # see pii_discovered_datasets()); override with an explicit list to narrow
  # or widen that.
  pii_discovery_enabled: true
  # pii_discovery_datasets: ["analytics", "raw", "marts"]

  # Datasets that must never be swept into the pii_discovery_datasets /
  # pii_content_scan_datasets auto-discovery default (pii_discovered_datasets()),
  # even if a source() or model makes them structurally reachable from the dbt
  # graph. Regexes matched against the resolved "database.schema" string. For a
  # dataset that holds live decrypted PII by design (e.g. chameleon-key-vault's
  # decrypted_views) this isn't optional cleanup -- scanning it and flagging its
  # columns as "undeclared, go declare this" would be actively wrong. Has no
  # effect on an explicit pii_discovery_datasets/pii_content_scan_datasets list;
  # only vetoes the inferred default.
  pii_discovery_exclude_dataset_patterns: []

  # Zero-config registry: flow discovery findings into pii_registry as visibility
  # entries (detection_method = INFORMATION_SCHEMA). They never override
  # declarations and still count as undeclared for the no_undeclared_pii test
  # and the UNREGISTERED readiness verdict.
  pii_auto_register_discovered: true

  # CI enforcement: the no_undeclared_pii test on pii_discovery. Defaults to 'warn'
  # so installing the package never breaks a build; set to 'error' in CI to enforce.
  pii_undeclared_severity: warn
  pii_undeclared_allowlist: []

  # CI enforcement: assert_no_shred_risk_reaching_marts fails when a field is
  # AT_RISK/NOT_SHREDDABLE/UNREGISTERED *and* reaches a mart. Same 'warn'-by-
  # default convention as pii_undeclared_severity above.
  pii_shred_risk_severity: warn

  # Content/value scanning (the expensive data plane). OFF by default — turn on
  # deliberately and run on a schedule, not every build. Scans name-innocent STRING
  # columns for PII in the actual values.
  pii_content_scan_enabled: false
  pii_content_sample_percent: 10          # TABLESAMPLE percent; 100 = full scan
  pii_content_max_bytes_billed: 1000000000  # 1 GB cap per scan
  # pii_content_scan_datasets: ["analytics", "raw"]   # defaults to pii_discovered_datasets()

  # How confident a name-pattern match is. Declared columns are always DECLARED.
  pii_inference_confidence: "INFERRED_HIGH"

  # Column-name patterns → classification. Override in your project's vars
  # to add company-specific names. Keys are case-insensitive regexes matched
  # against the column name.
  pii_name_patterns:
    "(^|_)email(_|$)": "DIRECT_IDENTIFIER"
    "(^|_)e_?mail": "DIRECT_IDENTIFIER"
    "(^|_)phone(_|$)|msisdn|mobile_number": "CONTACT"
    "(^|_)ssn(_|$)|social_security": "DIRECT_IDENTIFIER"
    "(^|_)dob(_|$)|date_of_birth|birth_date": "QUASI_IDENTIFIER"
    "first_name|last_name|full_name|(^|_)name$": "DIRECT_IDENTIFIER"
    "(^|_)address(_|$)|street|postcode|zip_code|postal": "QUASI_IDENTIFIER"
    "(^|_)ip(_address)?$|ip_addr": "QUASI_IDENTIFIER"
    "passport|national_id|tax_id|drivers_license": "DIRECT_IDENTIFIER"
    "credit_card|card_number|iban|account_number": "SENSITIVE"

  # pii_name_exclude_patterns is deliberately NOT set here anymore. A dbt
  # package can't push vars into a consuming project -- setting it only in
  # this file made it apply to this package's own dev/test runs and nowhere
  # else, which is exactly what let real false positives (metrics_phone_*,
  # ad_group_name, event_name) through in every actual install. The real
  # default now lives in macros/_helpers.sql's default_pii_name_exclude_patterns(),
  # which var("pii_name_exclude_patterns", ...) falls back to in every
  # consuming project automatically. Override or extend it in YOUR project's
  # own vars for company-specific dimension/metric names -- don't edit it here.

models:
  chameleon_pii:
    registry:
      +materialized: table
    discovery:
      +materialized: table
    readiness:
      +materialized: table
    scan:
      +materialized: table
